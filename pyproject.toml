[project]
name = "malmon"
version = "1.0.1"
description = "MalMon - Windows dynamic runtime monitor"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "psutil; platform_system == 'Windows'",
]

[project.scripts]
malmon = "malmon.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
